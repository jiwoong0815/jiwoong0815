<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Jiwoong Choi — aerospace software &amp; systems</title>
  <desc id="desc">Dark navy banner with subtle HUD grid, trajectory curve, and bilingual name lockup</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="55%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#101A2E"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#3DB8A8" stop-opacity="0"/>
      <stop offset="35%" stop-color="#3DB8A8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#C9A227" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#243044" stroke-width="1" opacity="0.55"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#sky)"/>
  <rect width="1200" height="360" fill="url(#grid)" opacity="0.45"/>

  <!-- left flight-strip ticks -->
  <g stroke="#3DB8A8" stroke-width="1.5" opacity="0.55">
    <line x1="36" y1="48" x2="36" y2="312"/>
    <line x1="28" y1="72" x2="44" y2="72"/>
    <line x1="28" y1="120" x2="44" y2="120"/>
    <line x1="28" y1="168" x2="52" y2="168"/>
    <line x1="28" y1="216" x2="44" y2="216"/>
    <line x1="28" y1="264" x2="44" y2="264"/>
  </g>

  <!-- faint mission-patch ring -->
  <g transform="translate(980,180)" fill="none" stroke="#243044" stroke-width="2">
    <circle r="78" opacity="0.9"/>
    <circle r="62" stroke="#3DB8A8" stroke-opacity="0.35"/>
    <path d="M-48,0 A48,48 0 0 1 48,0" stroke="#C9A227" stroke-opacity="0.45"/>
    <path d="M-20,-35 L0,-10 L28,-40" stroke="#3DB8A8" stroke-opacity="0.5"/>
  </g>

  <!-- trajectory plot -->
  <path d="M120 290 C 260 270, 320 210, 420 190 C 560 160, 620 120, 760 100 C 860 88, 940 70, 1060 48"
        fill="none" stroke="url(#trail)" stroke-width="3.5" filter="url(#glow)"/>
  <circle cx="760" cy="100" r="5" fill="#E8EEF7" filter="url(#glow)"/>
  <circle cx="760" cy="100" r="11" fill="none" stroke="#3DB8A8" stroke-opacity="0.7"/>

  <!-- telemetry readouts -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#9AA8BC" font-size="12">
    <text x="64" y="56">PROFILE  README</text>
    <text x="64" y="76" fill="#3DB8A8">STATUS  SEEKING SUMMER 2027</text>
    <text x="64" y="96">LOC     YUL - YOW</text>
  </g>

  <!-- name lockup -->
  <text x="64" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="54" fill="#E8EEF7">Jiwoong Choi</text>
  <text x="64" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#3DB8A8">최지웅  ·  aerospace / space software &amp; systems</text>
  <text x="64" y="268" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#9AA8BC">McGill Software Engineering Co-op  ·  Avionics Director @ MAD</text>
</svg>
